<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DrexOSS · Registrieren</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Inter',system-ui,sans-serif; background:#0a0a1a; color:#f1f1f9; min-height:100vh; display:flex; align-items:center; justify-content:center; }
.card { background:#0f0f23; border:1px solid #1e1e3a; border-radius:12px; padding:2.5rem; width:400px; }
.logo { width:44px; height:44px; border-radius:10px; background:linear-gradient(135deg,#5e5ce6,#7c7aff); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:1rem; color:#fff; margin:0 auto 0.75rem; }
h1 { text-align:center; font-size:1.3rem; font-weight:600; margin-bottom:0.5rem; }
.sub { text-align:center; font-size:0.82rem; color:#8888a0; margin-bottom:1.5rem; }
.form-group { margin-bottom:1rem; }
.form-group label { display:block; font-size:0.7rem; color:#8888a0; margin-bottom:0.3rem; text-transform:uppercase; letter-spacing:0.05em; }
.form-group input { width:100%; padding:0.6rem; background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.1); border-radius:6px; color:#f1f1f9; font-size:0.9rem; font-family:inherit; outline:none; }
.form-group input:focus { border-color:rgba(94,92,230,0.4); }
.error { font-size:0.78rem; color:#ef4444; margin-bottom:0.75rem; display:none; }
.success { font-size:0.78rem; color:#34d399; margin-bottom:0.75rem; display:none; }
.btn-primary { width:100%; padding:0.65rem; background:#5e5ce6; border:none; border-radius:6px; color:#fff; font-size:0.9rem; cursor:pointer; font-family:inherit; font-weight:500; }
.btn-primary:hover { background:#6d6bf0; }
.footer-text { text-align:center; margin-top:1.25rem; font-size:0.8rem; color:#5c5c78; }
.footer-text a { color:#5e5ce6; text-decoration:none; }
.form-row { display:flex; gap:0.75rem; }
.form-row .form-group { flex:1; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">D</div>
  <h1>Konto erstellen</h1>
  <p class="sub">Registriere dich für den DrexOSS-Plattform-Zugang</p>
  <div class="error" id="reg-error"></div>
  <div class="success" id="reg-success"></div>
  <div class="form-row">
    <div class="form-group">
      <label>Vorname</label>
      <input id="firstname" placeholder="Max">
    </div>
    <div class="form-group">
      <label>Nachname</label>
      <input id="lastname" placeholder="Mustermann">
    </div>
  </div>
  <div class="form-group">
        <label>Email</label>
        <input id="email" type="email" name="email" placeholder="max@example.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label>Passwort</label>
        <input id="password" type="password" name="password" minlength="8" placeholder="••••••••" autocomplete="new-password" onkeydown="if(event.key==='Enter')doRegister()">
        <div style="font-size:0.65rem;color:#64748b;margin-top:0.2rem;">Mindestens 8 Zeichen, ein Großbuchstabe, eine Zahl</div>
      </div>
  <button class="btn-primary" onclick="doRegister()">Konto erstellen</button>
  <div class="footer-text">Bereits registriert? <a href="/login">Anmelden</a></div>
</div>
<script>
const SUPABASE_URL = 'https://rmveqbegqfthwdopzykh.supabase.co';
const SERVICE_KEY = 'sb_publishable_ByDyItDAH-NvgMLIitjl9w_VdNJZqtp';

async function doRegister() {
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('password').value;
  const firstname = document.getElementById('firstname').value.trim() || 'User';
  const lastname = document.getElementById('lastname').value.trim() || '';
  const errEl = document.getElementById('reg-error');
  const okEl = document.getElementById('reg-success');

  if (!email || !pass) { errEl.textContent = '❌ Email und Passwort erforderlich'; errEl.style.display = 'block'; return; }
  if (pass.length < 8) { errEl.textContent = '❌ Passwort muss mindestens 8 Zeichen haben'; errEl.style.display = 'block'; return; }
  if (!/[A-Z]/.test(pass)) { errEl.textContent = '❌ Passwort muss mindestens einen Großbuchstaben enthalten'; errEl.style.display = 'block'; return; }
  if (!/[0-9]/.test(pass)) { errEl.textContent = '❌ Passwort muss mindestens eine Zahl enthalten'; errEl.style.display = 'block'; return; }
  if (!email.includes('@')) { errEl.textContent = '❌ Ungültige Email-Adresse'; errEl.style.display = 'block'; return; }

  errEl.style.display = 'none';
  try {
    // Create user via Supabase Auth admin API
    const res = await fetch(SUPABASE_URL + '/auth/v1/signup', {
      method: 'POST',
      headers: { 'apikey': SERVICE_KEY, 'Authorization': 'Bearer ' + SERVICE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: pass, email_confirm: true })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.msg || 'Registrierung fehlgeschlagen');

    okEl.textContent = '✅ Konto erstellt! Du wirst weitergeleitet...';
    okEl.style.display = 'block';
    setTimeout(() => window.location.href = '/login', 1500);
  } catch(e) {
    errEl.textContent = '❌ ' + e.message;
    errEl.style.display = 'block';
  }
}
</script>
</body>
</html>
